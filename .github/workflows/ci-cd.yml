name: CI/CD Build and GitOps Update

on:
  workflow_dispatch: 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: devops-sample-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Checkout GitOps Infra Repository
        uses: actions/checkout@v4
        with:
          repository: 'YOUR_GITHUB_USERNAME/gitops-infra'
          token: ${{ secrets.GITOPS_PAT_TOKEN }}
          path: 'gitops-infra'

      - name: Update Image Tag via Kustomize
        run: |
          cd gitops-infra/k8s/overlays/dev
          sudo snap install kustomize
          kustomize edit set image devops-sample-app=${{ steps.login-ecr.outputs.registry }}/devops-sample-app:${{ github.sha }}

      - name: Commit and Push Updated Manifest
        run: |
          cd gitops-infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "Automated GitOps update: image tag ${{ github.sha }}" || exit 0
          git push
